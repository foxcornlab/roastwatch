<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-label="The two live paths against a domain controller">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#0d1117"/>
  <text x="36" y="36" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="20" font-weight="bold" fill="#e6edf3">The two live paths (TCP/88 by default, --udp for UDP)</text>

  <g font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">
    <!-- lane A: asrep -->
    <text x="36" y="76" font-size="15" fill="#f85149">asrep mode, zero credentials:</text>

    <rect x="36" y="92" width="110" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="91" y="119" font-size="15" fill="#e6edf3" text-anchor="middle">you</text>

    <line x1="146" y1="114" x2="248" y2="114" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="197" y="104" font-size="11" fill="#8b949e" text-anchor="middle">AS-REQ</text>
    <text x="197" y="132" font-size="11" fill="#8b949e" text-anchor="middle">no preauth</text>

    <rect x="256" y="92" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="341" y="112" font-size="15" fill="#e6edf3" text-anchor="middle">domain ctrl</text>
    <text x="341" y="129" font-size="12" fill="#8b949e" text-anchor="middle">kerberos/tcp 88</text>

    <line x1="426" y1="114" x2="528" y2="114" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="477" y="104" font-size="11" fill="#8b949e" text-anchor="middle">AS-REP</text>
    <text x="477" y="132" font-size="11" fill="#8b949e" text-anchor="middle">enc-part</text>

    <rect x="536" y="92" width="368" height="44" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="720" y="112" font-size="13" fill="#3fb950" text-anchor="middle">$krb5asrep$23$user@REALM:hex16$hex</text>
    <text x="720" y="129" font-size="12" fill="#8b949e" text-anchor="middle">hashcat -m 18200 (RC4) / 32100 / 32200 (AES)</text>

    <!-- lane B: roast -->
    <text x="36" y="192" font-size="15" fill="#d29922">roast mode, one low-privilege account:</text>

    <rect x="36" y="208" width="150" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="111" y="228" font-size="15" fill="#e6edf3" text-anchor="middle">you + nthash</text>
    <text x="111" y="245" font-size="11" fill="#8b949e" text-anchor="middle">AS-REQ + timestamp</text>

    <line x1="186" y1="230" x2="288" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="237" y="220" font-size="11" fill="#8b949e" text-anchor="middle">1. AS-REQ</text>

    <rect x="296" y="208" width="130" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="361" y="235" font-size="15" fill="#e6edf3" text-anchor="middle">DC</text>

    <line x1="426" y1="230" x2="528" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="477" y="220" font-size="11" fill="#8b949e" text-anchor="middle">2. AS-REP</text>
    <text x="477" y="248" font-size="11" fill="#8b949e" text-anchor="middle">session key</text>

    <rect x="536" y="208" width="120" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="596" y="235" font-size="15" fill="#e6edf3" text-anchor="middle">TGT in hand</text>

    <line x1="656" y1="230" x2="758" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
    <text x="707" y="220" font-size="11" fill="#8b949e" text-anchor="middle">3. TGS-REQ per SPN</text>

    <rect x="766" y="208" width="138" height="44" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="835" y="228" font-size="13" fill="#3fb950" text-anchor="middle">$krb5tgs$23$*</text>
    <text x="835" y="245" font-size="12" fill="#8b949e" text-anchor="middle">hashcat -m 13100</text>

    <!-- step 3 detail -->
    <text x="36" y="300" font-size="13" fill="#8b949e">step 3 asks each SPN with etype 23 first. If the KDC refuses RC4 the same SPN is</text>
    <text x="36" y="320" font-size="13" fill="#8b949e">retried with AES and emitted as mode 19600/19700. Authenticator is RC4-HMAC</text>
    <text x="36" y="340" font-size="13" fill="#8b949e">(RFC 4757) over a minimal RFC 4120 authenticator, no subkey.</text>

    <text x="36" y="384" font-size="14" fill="#8b949e">unreachable DC = one error line and exit 2. KDC errors map to readable text</text>
    <text x="36" y="404" font-size="14" fill="#8b949e">(6 unknown user, 7 unknown SPN, 14 etype refused, 24 bad key, 25 preauth required).</text>
  </g>
</svg>
