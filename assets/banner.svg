<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-label="roastwatch banner">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1280" height="240" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="4" fill="#d29922"/>

  <!-- shield mark -->
  <g>
    <path d="M 120 60 L 168 78 L 168 128 C 168 158 146 178 120 190 C 94 178 72 158 72 128 L 72 78 Z"
          fill="none" stroke="#f85149" stroke-width="6"/>
    <path d="M 120 96 C 130 96 138 104 138 114 C 138 121 134 127 128 130 L 131 148 L 109 148 L 112 130 C 106 127 102 121 102 114 C 102 104 110 96 120 96 Z"
          fill="#f85149"/>
    <text x="120" y="172" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#8b949e" text-anchor="middle">krb5</text>
  </g>

  <!-- title block -->
  <text x="216" y="108" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="56" font-weight="bold" fill="#e6edf3">roastwatch</text>
  <text x="218" y="150" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#58a6ff">Kerberoast / AS-REP roastability enumerator</text>
  <text x="218" y="184" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="18" fill="#8b949e">LDIF audit + live KDC queries, hashcat-format output, stdlib only</text>

  <!-- motif tiles -->
  <g font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="14">
    <rect x="992" y="62" width="236" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="1010" cy="80" r="4" fill="#3fb950"/>
    <text x="1024" y="85" fill="#3fb950">$krb5asrep$23$</text>
    <rect x="992" y="106" width="236" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="1010" cy="124" r="4" fill="#d29922"/>
    <text x="1024" y="129" fill="#d29922">$krb5tgs$23$*user$</text>
    <rect x="992" y="150" width="236" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="1010" cy="168" r="4" fill="#58a6ff"/>
    <text x="1024" y="173" fill="#58a6ff">hashcat -m 18200</text>
  </g>
</svg>
